<div class="login-container">
  <div class="login-card">
    <picture>
      <source srcset="/1280px-Logo_PMF_Niš.png" type="image/png" />
      <img src="/1280px-Logo_PMF_Niš.png" alt="PMF Niš logo" class="login-logo" />
    </picture>
    <h2>Dobrodošli na portal Prirodno-matematičkog fakulteta u Nišu</h2>
    <p>Dobrodošli nazad! Prijavite se kako biste pristupili svom nalogu.</p>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="username">Korisničko ime</label>
        <input id="username" type="text" [(ngModel)]="username" name="username" required />
      </div>
      <div class="form-group">
        <label for="password">Lozinka</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" required />
      </div>
      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
      <button type="submit" [disabled]="loading">
        {{ loading ? 'Prijavljivanje...' : 'Prijavi se' }}
      </button>
    </form>

    <div class="university-info">
      <p>Za profesore i studente</p>
    </div>
  </div>
</div>
