<header class="app-header">
  <div class="header-container">
    <div class="header-title">🎓 Sistem za upravljanje predmetima</div>
    <div class="header-actions">
      <span class="user-info" *ngIf="authService.isLoggedIn">
        Prijavljen
      </span>
      <button
        *ngIf="authService.isLoggedIn"
        class="btn-logout"
        (click)="logout()"
        title="Odjavite se iz sistema"
      >
        Odjava
      </button>
    </div>
  </div>
</header>

<main class="app-main">
  <router-outlet></router-outlet>
</main>
